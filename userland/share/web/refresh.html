<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel cadence</title>
<!--
  The panel's real cadence, measured on the device.

  A host-side frame count ("N frames in 5 s") says how many frames the driver
  produced; it does not say what iOS asked for or what the panel showed. This
  page measures the interval between requestAnimationFrame callbacks, which is
  the cadence the system is actually running the display at, and shows it large
  enough that one screenshot answers the question.

  It is served from the small root (file:///redwood/share/web/refresh.html) so
  no network is needed: Wi-Fi is not ported yet.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
               font: 16px -apple-system, system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; box-sizing: border-box;
          padding: 16px 20px; gap: 10px; }
  #hz { font-size: 34vmin; line-height: 0.95; font-weight: 700; letter-spacing: -2px;
        text-align: center; }
  #hz small { font-size: 0.22em; font-weight: 400; opacity: 0.7; letter-spacing: 0; }
  #sub { text-align: center; font-size: 3.6vmin; opacity: 0.85; font-variant-numeric: tabular-nums; }
  #bars { flex: 1 1 auto; display: block; width: 100%; min-height: 90px; }
  #foot { font-size: 2.6vmin; opacity: 0.55; font-variant-numeric: tabular-nums;
          display: flex; justify-content: space-between; gap: 12px; }
</style>
<div id="wrap">
  <div id="hz">--<small> Hz</small></div>
  <div id="sub">measuring…</div>
  <canvas id="bars"></canvas>
  <div id="foot"><span id="info"></span><span id="budget"></span></div>
</div>
<script>
(function () {
  var WINDOW = 120;                 // frames the headline number is averaged over
  var BUCKET_MS = 2, BUCKETS = 40;  // histogram: 0..80 ms in 2 ms steps
  var hist = new Int32Array(BUCKETS);
  var last = null, stamps = [], t0 = performance.now(), frames = 0;
  var worst = 0, best = 1e9, since = 0;

  var elHz = document.getElementById('hz');
  var elSub = document.getElementById('sub');
  var elInfo = document.getElementById('info');
  var elBudget = document.getElementById('budget');
  var canvas = document.getElementById('bars');
  var ctx = canvas.getContext('2d');

  function resize() {
    var r = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(r.width * devicePixelRatio));
    canvas.height = Math.max(1, Math.round(r.height * devicePixelRatio));
  }
  addEventListener('resize', resize);
  resize();

  function draw() {
    var w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    var peak = 1;
    for (var i = 0; i < BUCKETS; i++) peak = Math.max(peak, hist[i]);
    var bw = w / BUCKETS;
    for (i = 0; i < BUCKETS; i++) {
      var v = hist[i] / peak;
      var bh = Math.max(hist[i] ? 2 : 0, v * (h - 2));
      // 16.7 ms sits at bucket 8: mark the 60 Hz reference in green.
      ctx.fillStyle = (i === Math.round(1000 / 60 / BUCKET_MS)) ? '#3d7' : '#48f';
      ctx.fillRect(i * bw + 1, h - bh, Math.max(1, bw - 2), bh);
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1 * devicePixelRatio;
    var ref = Math.round(1000 / 60 / BUCKET_MS) * bw;
    ctx.beginPath(); ctx.moveTo(ref, 0); ctx.lineTo(ref, h); ctx.stroke();
  }

  function step(now) {
    if (last !== null) {
      var dt = now - last;
      frames++;
      since += dt;
      stamps.push(dt);
      if (stamps.length > WINDOW) stamps.shift();
      var b = Math.min(BUCKETS - 1, Math.max(0, Math.floor(dt / BUCKET_MS)));
      hist[b]++;
      if (dt > worst) worst = dt;
      if (dt < best) best = dt;
      if (frames % 10 === 0) {
        var sum = 0;
        for (var i = 0; i < stamps.length; i++) sum += stamps[i];
        var mean = sum / stamps.length;
        elHz.innerHTML = (1000 / mean).toFixed(1) + '<small> Hz</small>';
        elSub.textContent = mean.toFixed(1) + ' ms a frame  ·  ' +
          best.toFixed(1) + '–' + worst.toFixed(1) + ' ms  ·  ' + frames + ' frames';
        elInfo.textContent = screen.width + '×' + screen.height + ' @' +
          devicePixelRatio.toFixed(2) + 'x  ·  ' +
          ((performance.now() - t0) / 1000).toFixed(0) + ' s';
        // A frame budget miss is the useful signal: 16.7 ms for 60 Hz.
        var late = 0;
        for (i = 0; i < stamps.length; i++) if (stamps[i] > 1000 / 50) late++;
        elBudget.textContent = late ? (100 * late / stamps.length).toFixed(0) + '% over 20 ms' : 'on cadence';
        draw();
        if (frames % 600 === 0) { hist.fill(0); best = 1e9; worst = 0; }
      }
    }
    last = now;
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>
